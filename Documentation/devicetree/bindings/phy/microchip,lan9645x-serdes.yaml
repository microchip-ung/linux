%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/microchip,lan9645x-serdes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip Lan9645x Serdes controller

maintainers:
  - Jens Emil Schulz Østergaard <jensemil.schulzostergaard@microchip.com>

description: |
  Lan9645x has 2 SERDES6G interfaces. One of the SERDES6G supports QSGMII.
  The Serdes controller configures these interfaces and allows "muxing" them
  to different ports.

  The macro LAN9645X_SERDES6G(X) selects SerDes interface X.

properties:
  $nodename:
    pattern: "^serdes@[0-9a-f]+$"

  compatible:
    const: microchip,lan9645x-serdes

  reg:
    items:
      - description: HSIO registers
      - description: |
          HW_STAT register for reading PLL clock setting 125mhz or 25mhz.

  reg-names:
    items:
      - description: HSIO registers
        const: hsio
      - description: CHIP_TOP registers
        const: chip_top

  '#phy-cells':
    const: 2
    description: |
      - Input port number.
      - The SerDes index, using the LAN9645X_SERDES6G(X) macro from
        dt-bindings/phy/phy-lan9645x-serdes.h.

required:
  - compatible
  - '#phy-cells'
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    serdes@b0000 {
      compatible = "microchip,lan9645x-serdes";
      reg = <0 0>, <0 0>;
      reg-names = "hsio", "chip_top";
      #phy-cells = <2>;
    };

...
